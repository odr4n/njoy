<title>N:Joy Studios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root {
    --bg: #f6f4f0; --bg2: #efebe5; --ink: #2f3a3a; --muted: #6b7575;
    --teal: #5fa3a0; --orange: #f09448; --green: #a0c83c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    background: linear-gradient(180deg, #faf8f4, var(--bg2));
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden; position: relative;
  }
  .blob { position: fixed; border-radius: 50%; z-index: 0; pointer-events: none; }
  .b1 { width: 46vmax; height: 46vmax; left: -16vmax; top: -18vmax; background: var(--teal); opacity: .15; }
  .b2 { width: 40vmax; height: 40vmax; right: -14vmax; bottom: -16vmax; background: var(--orange); opacity: .15; }
  .b3 { width: 12vmax; height: 12vmax; right: 6vw; top: -4vmax; background: var(--green); opacity: .18; }
  main {
    position: relative; z-index: 1; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 16px;
  }
  .logo { width: min(520px, 86vw); height: auto; filter: drop-shadow(0 8px 14px rgba(0,0,0,.08)); }
  h1 { font-size: clamp(1.1rem, 2.4vw, 1.4rem); font-weight: 700; letter-spacing: .14em; margin: 28px 0 8px; color: var(--teal); }
  p { margin: 0 0 32px; color: var(--muted); font-size: 1.05rem; line-height: 1.5; max-width: 34rem; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--orange); color: #fff; text-decoration: none;
    font-weight: 700; font-size: 1.05rem; padding: 14px 28px; border-radius: 999px;
    box-shadow: 0 6px 16px rgba(240,148,72,.35); transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(240,148,72,.4); }
  .btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
  .addr { display: block; margin-top: 14px; color: var(--muted); font-size: .95rem; }
  footer { position: relative; z-index: 1; text-align: center; padding: 20px 16px 28px; color: var(--muted); font-size: .85rem; }
</style>
</head>
